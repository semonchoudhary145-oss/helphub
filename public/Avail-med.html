<!DOCTYPE html>
<html>

<head>
    <title>Avail Medicine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style/Avail-med.css">
    <script>
        function back() {
            localStorage.removeItem("activeuser");
            location.href = "Dash-donor.html"
        }
    </script>
    <script>
        function doshowprev3(fileCtrl, prev) {
            const file = fileCtrl.files[0];
            if (file) {
                prev.src = URL.createObjectURL(file);
            }
        }
    </script>
</head>

<body>

    <!--------------------nav bar----------------------->
    <nav class="navbar navbar-expand-lg" style="background-color: rgb(57, 102, 144);">
        <div class="container-fluid">
            <a class="navbar-brand text-white d-flex align-items-center fw-bold fs-5 w-100" href="#">
                <img src="/pics/websitelogo.jpeg" alt="Logo" class="rounded-circle me-2" width="35" height="35"
                    class="d-inline-block align-text-top me-2 rounded">
                <span
                    style="text-shadow: 2px 2px 4px rgba(255,255,255,0.7); box-shadow: 0 8px 12px rgba(0,0,0,0.3); ">Help_Hub.com</span>
                <!--<span class="text-white fw-bold fs-5 position-absolute top-50 start-50 translate-middle"
                    style="text-shadow: 2px 2px 4px rgba(255,255,255,0.7); ">HELLO DONORS 🙋🏻‍♀️</span>-->
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <form class="d-flex gap-3 ms-auto">


                <button class="btn btn-outline-light" onclick="back()" type="button">Back</button>
            </form>

        </div>

    </nav>
    <div class="container mt-4">
        <div class="ProfileForm">
            <h2 class="text-center mb-4" style="color: rgb(32, 66, 98);">AVAIL MEDICINE</h2>
            <br>

            <form action="/avail-medicine" method="post" enctype="multipart/form-data">
                <div class="row g-4 ">
                    <!------------------------left side wali pic upload------------------------>
                    <div class="col-md-5">
                       
                        <div class="card p-3 text-center upload-card">
                              <label><b>📷 Upload Medicine Pic:</b></label>

                            <input type="file" name="medpic" id="medpic" class="form-control custom-file"
                                onchange="doshowprev3(this,prev3)">
                            <center>
                                <img src="" id="prev3" alt="" width="200" height="200" class="preview-img">
                            </center>
                        </div>
                    </div>



                    <!-----------------------right side wala form-------------------------------->
                    <div class="col-md-7 row g-1">
                        <div class="col-12 mb-3">
                            <label><b>Email ID:</b></label>
                            <input type="email" name="txtEmail" id="txtEmail" class="form-control"
                                placeholder="Enter your emailid" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label><b>Medicine Name:</b></label>
                            <input type="text" name="txtMedname" id="txtMedname" class="form-control"
                                placeholder="Enter Medicine Name" required>
                        </div>
                        <div class="col-md-6 mb-6">
                            <label><b>Expiry Date:</b></label>
                            <input type="date" name="txtExpiry" id="txtExpiry" class="form-control"
                                placeholder="Enter Expiry Date" required>
                        </div>
                        <div class="mb-3 mb-1">
                            <label><b>Company:</b></label>
                            <input type="text" name="txtCompany" id="txtCompany" class="form-control"
                                placeholder="Enter Company Name" required>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label><b>Packing:</b></label>
                                <select name="txtPacking" id="txtPacking" class="form-select">
                                    <option>Select Packing</option>
                                    <option>Strip</option>
                                    <option>Bottle</option>
                                    <option>Box</option>
                                </select>
                            </div>
                            <div class="col-6 mb-6">
                                <label><b>Quantity:</b></label>
                                <select name="txtQty" id="txtQty" class="form-select" placeholder="Enter Quantity">
                                    <option>1</option>
                                    <option>2</option>
                                    <option>3</option>
                                    <option>4</option>
                                    <option>5</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-6 form-group mb-4">
                            <label><b>Other Information:</b></label>
                            <textarea name="txtInfo" id="txtInfo" class="form-control" rows="2"
                                placeholder="Enter other Details"></textarea>
                        </div>
                        <div class="col-12 text-center ">
                            <button type="submit" class="btn w-100 text-white"
                                style="background-color: rgb(57, 102, 144);">Avail</button>
                        </div>
                    </div>

                </div>
            </form>
        </div>
    </div>
</body>
