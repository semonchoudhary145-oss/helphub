<!DOCTYPE html>
<html>

<head>
    <title>Available Equipment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="style/Avail-med.css">
    <script>
        function back() {
            localStorage.removeItem("activeuser");
            location.href = "Dash-donor.html"
        }
    </script>
    <script>
        function doshowprev4(fileCtrl, prev) {
            const file = fileCtrl.files[0];
            if (file) {
                prev.src = URL.createObjectURL(file);
            }
        }
        function doshowprev5(fileCtrl, prev) {
            const file = fileCtrl.files[0];
            if (file) {
                prev.src = URL.createObjectURL(file);
            }
        }
    </script>
    <script>
        function disabld() {

            if (document.getElementById("type").checked) {
                document.getElementById("txtAmount").disabled = false;
            } else {
                document.getElementById("txtAmount").disabled = true;
                document.getElementById("txtAmount").value = "";
            }

        }
    </script>
</head>

<body>


    <!--------------------nav bar----------------------->
    <nav class="navbar navbar-expand-lg" style="background-color: rgb(57, 102, 144);">
        <div class="container-fluid">
            <a class="navbar-brand text-white d-flex align-items-center fw-bold fs-5 w-100" href="#">
                <img src="/pics/websitelogo.jpeg" alt="Logo" class="rounded-circle me-2" width="35" height="35"
                    class="d-inline-block align-text-top me-2 rounded">
                <span
                    style="text-shadow: 2px 2px 4px rgba(255,255,255,0.7); box-shadow: 0 8px 12px rgba(0,0,0,0.3); ">Help_Hub.com</span>
                <!--<span class="text-white fw-bold fs-5 position-absolute top-50 start-50 translate-middle"
                    style="text-shadow: 2px 2px 4px rgba(255,255,255,0.7); ">HELLO DONORS 🙋🏻‍♀️</span>-->
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <form class="d-flex gap-3 ms-auto">


                <button class="btn btn-outline-light" onclick="back()" type="button">Back</button>
            </form>

        </div>

    </nav>
    <div class="container mt-4">
        <div class="ProfileForm3">
            <form action="/chk-equipment" enctype="multipart/form-data" method="post">
                <h2 class="text-center mb-4" style="color: rgb(28, 59, 88);">AVAIL EQUIPMENT</h2>
                <div class="row g-6 mb-6">
                    <div class="col-md-11 mb-4">
                        <label for="inputEmail4" class="form-label mb-1"><b>Email Id:</b></label>
                        <input type="email" class="form-control form-control-sm" name="txtEmail" id="txtEmail"
                            placeholder="Enter Emailid" required>
                    </div>
                </div>
                <div class="row g-6 mb-4">
                    <div class="col-md-5 mb-4">
                        <label for="inputName4" class="form-label mb-1"><b>Medical Equipment Type:</b></label>
                        <input type="text" class="form-control form-control-sm" name="txtEquipment" id="txtEquipment"
                            placeholder="Enter Medical Equipment " required>
                    </div>
                    <div class="col-md-5">
                        <b>Condition:</b>
                        <select class="form-select" id="txtCondition" name="txtCondition"
                            aria-label="Default select example" required>
                            <option selected> Select Condition</option>

                            <option value="GOOD">GOOD</option>
                            <option value="BETTER">BETTER</option>
                            <option value="WORST">WORST</option>
                        </select>
                    </div>
                </div>
                <div class="row g-4  mb-3">
                    <div class="col-md-3">
                        <input type="radio" name="type" value="wanttobuy" id="type" onclick="disabld()" required><b>Want
                            to Buy</b>
                    </div>
                    <div class="col-md-3">
                        <input type="radio" name="type" value="borrow" id="type2" onclick="disabld()"
                            required><b>Borrow</b>
                    </div>
                    <div class="col-md-4">
                        <label for="inputName4" class="form-label mb-1"><b>Amount:</b></label>
                        <input type="text" name="txtAmount" id="txtAmount" disabled>
                    </div>
                </div>
                 <div class=" row g-2 mb-5">
                    <label><b>Other Information:</b></label>
                    <textarea name="txtInfo" id="txtInfo" name="txtInfo" class="form-control" rows="2"
                        placeholder="Enter Details" required></textarea>
                </div>
                <div class="row g-5 mb-5 justify-content-between">
                    <!-- Upload Pic 1 -->
                    <div class="col-md-6 d-flex align-items-center">
                        <div class="card p-3 text-center upload-card w-100">
                            <label class="fw-bold mb-3"><b>📷 Upload Pic 1:</b></label>
                            <input class="form-control custom-file" type="file" name="picUrl"
                                onchange="doshowprev4(this,prev4)" required>
                            <center>
                                <img src="" id="prev4" alt="" width="200" height="200" class="preview-img">
                            </center>
                        </div>
                    </div>

                    <!-- Upload Pic 2 -->
                    <div class="col-md-6 d-flex align-items-center">
                        <div class="card p-3 text-center upload-card w-100">
                            <label class="fw-bold mb-3"><b>📷 Upload Pic 2:</b></label>
                            <input class="form-control custom-file" type="file" name="picUrl2"
                                onchange="doshowprev5(this,prev5)" required>
                            <center>
                                <img src="" id="prev5" alt="" width="200" height="200" class="preview-img">
                            </center>
                        </div>
                    </div>
                </div>
               
                <center>
                    <button type="submit" class="btn btn-sm text-white"
                        style="background-color: rgb(57, 102, 144);">Avail for the Needies</button>
                </center>



            </form>
        </div>
    </div>
</body>

</html>
