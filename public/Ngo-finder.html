<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style/ngo-finder.css">

     <script>
    function back() {
      localStorage.removeItem("activeuser");
      location.href = "Dash-needy.html"
    }
  </script>
    
</head>
<script>
    let myModule = angular.module("modulekuch", []);
    let myController = myModule.controller("controllerkuch", function ($scope, $http) {
        //-------------fetch city from ngo table--------------------------//
        $scope.fetchcity = function () {
            //alert("function chala");
            let url = "/fetch-ngo-city";
            $http.get(url).then(function (resp) {
                // console.log(resp.data);
                $scope.jsonarraycity = resp.data;
            }, function (err) {
                alert("Error:" + err);
            })
        }

        //--------------button click find ngo-------------------//
        $scope.findngo = function () {
            // alert("button clicked");
            let url = "/find-ngo?txtCity=" + $scope.selcity;

            $http.get(url).then(function (resp) {
                // alert("data aa gaya");
                // console.log(resp.data);
                alert(JSON.stringify(resp.data));
                $scope.jsonarrayngo = resp.data;
            }, function (err) {
                alert("Error:" + err);
            })
        }
    })
</script>

<body ng-app="modulekuch" ng-controller="controllerkuch" ng-init="fetchcity()">

    <!--------------------nav bar----------------------->
    <nav class="navbar navbar-expand-lg" style="background-color: rgb(57, 102, 144);">
        <div class="container-fluid">
            <a class="navbar-brand text-white d-flex align-items-center fw-bold fs-5 w-100" href="#">
                <img src="/pics/websitelogo.jpeg" alt="Logo" class="rounded-circle me-2" width="35" height="35"
                    class="d-inline-block align-text-top me-2 rounded">
              <span
                    style="text-shadow: 2px 2px 4px rgba(255,255,255,0.7); box-shadow: 0 8px 12px rgba(0,0,0,0.3); ">Help_Hub.com</span>
                     <!--<span class="text-white fw-bold fs-5 position-absolute top-50 start-50 translate-middle"
                    style="text-shadow: 2px 2px 4px rgba(255,255,255,0.7); ">HELLO DONORS 🙋🏻‍♀️</span>-->
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <form class="d-flex gap-3 ms-auto">


                <button class="btn btn-outline-light" onclick="back()" type="button">Back</button>
            </form>

        </div>

    </nav>

    <div class="container mt-4">

        <div class="ProfileForm2">
            <h2 class="text-center mb-4" style="color: rgb(34, 67, 99);">NGO FINDER</h2>
            <div class="row gx-3 mb-3 align-items-end">
                <div class="col-md-6">
                    <label  class="form-label mb-1"><b>City:</b></label>
                    <input type="text" list="city-list" ng-model="selcity" class="form-control"
                         placeholder="Enter City" required>
                    <datalist id="city-list">
                        <option ng-repeat="obj in jsonarraycity" value="{{obj.city}}"></option>
                    </datalist>
                </div>
                <div class="col-md-5">
                    <button type="button" class="btn text-white px-5" style="background-color: rgb(57, 102, 144);width: 400px;" ng-click="findngo()">Find
                        NGO's</button>
                </div>

            </div>
      
<br>
    <div class="container mt-4" ng-if="jsonarrayngo">
        <h4 class="text-center mb-3">NGO's in {{selcity}}</h4>
        <table class="table table-bordered table-striped table-hover">
            <thead class="table" style="background-color: rgb(57, 102, 144);">
                <tr>
                    <th>Sr.No</th>
                    <th>Email Id</th>
                    <th>NGO Name</th>
                    <th>Registered Office Address</th>
                   
                    <th>Website</th>
                    <th>Contact Number</th>
                    <th>Since</th>
                   
                      <th>Ngo Works</th>
                  
                    <th>Register Proof</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="obj in jsonarrayngo">
                    <td>{{$index + 1}}</td>
                    <td>{{obj.emailid}}</td>
                    <td>{{obj.ngo}}</td>
                    <td>{{obj.regoffice}}</td>
                  
                      <td>{{obj.website}}</td>
                    <td>{{obj.contactno}}</td>
                    <td>{{obj.since}}</td>
                  
                    <td>{{obj.ngoworks}}</td>
                 
                    <td>
                        <center>
                            <img src={{obj.picurl}} width="50" height="50" alt="">
                        </center>
                    </td>
                </tr>
            </tbody>
        </table>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
          </div>
    </div>
</body>

</html>
