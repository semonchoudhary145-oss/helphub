<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style/ngo-finder.css">
      <script>
    function back() {
      localStorage.removeItem("activeuser");
      location.href = "Dash-needy.html"
    }
  </script>
    <script>
        function doshowprev7(fileCtrl, prev) {
            const file = fileCtrl.files[0];
            if (file) {
                prev.src = URL.createObjectURL(file);
            }
        }
        function doshowprev8(fileCtrl, prev) {
            const file = fileCtrl.files[0];
            if (file) {
                prev.src = URL.createObjectURL(file);
            }
        }
    </script>
</head>

<body>

      <!--------------------nav bar----------------------->
    <nav class="navbar navbar-expand-lg" style="background-color: rgb(57, 102, 144);">
        <div class="container-fluid">
            <a class="navbar-brand text-white d-flex align-items-center fw-bold fs-5 w-100" href="#">
                <img src="/pics/websitelogo.jpeg" alt="Logo" class="rounded-circle me-2" width="35" height="35"
                    class="d-inline-block align-text-top me-2 rounded">
              <span
                    style="text-shadow: 2px 2px 4px rgba(255,255,255,0.7); box-shadow: 0 8px 12px rgba(0,0,0,0.3); ">Help_Hub.com</span>
                     <!--<span class="text-white fw-bold fs-5 position-absolute top-50 start-50 translate-middle"
                    style="text-shadow: 2px 2px 4px rgba(255,255,255,0.7); ">HELLO DONORS 🙋🏻‍♀️</span>-->
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <form class="d-flex gap-3 ms-auto">


                <button class="btn btn-outline-light" onclick="back()" type="button">Back</button>
            </form>

        </div>

    </nav>
    <div class="container mt-4">
        <div class="ProfileForm">
            <form action="/chk-needyprofile" method="post" enctype="multipart/form-data" >
            <h2 class="text-center mb-4" style="color: rgb(26, 55, 82);">NEEDY PROFILE</h2>
                <br>
                <div class="row g-4">
                    <div class="col-md-6 mb-3">
                        <label><b>Email ID:</b></label>
                        <input type="email" name="txtEmail" id="txtEmail" class="form-control"
                            placeholder="Enter your emailid" required>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label><b>Mobile Number:</b></label>
                        <input type="text" name="txtMobile" id="txtMobile" class="form-control"
                            placeholder="Enter Mobile No." required>
                    </div>
                </div>
                <br>
               

                 <div class="row g-5 mb-5 justify-content-between">
                    <!-- Upload Pic 1 -->
                    <div class="col-md-6 d-flex align-items-center">
                        <div class="card p-3 text-center upload-card w-100">
                            <label class="fw-bold mb-3"><b>📷 Upload Aadhar Card Front Pic:</b></label>
                            <input class="form-control custom-file" type="file" name="picUrl"
                                onchange="doshowprev7(this,prev7)" required>
                            <center>
                                <img src="" id="prev7" alt="" width="200" height="200" class="preview-img">
                            </center>
                        </div>
                    </div>

                    <!-- Upload Pic 2 -->
                    <div class="col-md-6 d-flex align-items-center">
                        <div class="card p-3 text-center upload-card w-100">
                            <label class="fw-bold mb-3"><b>📷 Upload Aadhar Card Rear Pic:</b></label>
                            <input class="form-control custom-file" type="file" name="picUrl2"
                                onchange="doshowprev8(this,prev8)" required>
                            <center>
                                <img src="" id="prev8" alt="" width="200" height="200" class="preview-img">
                            </center>
                        </div>
                    </div>
                </div>
                <br>
                <center>
                    <button type="submit" class="btn text-white btn-sm" style="background-color: rgb(57, 102, 144); width: 300px;">Upload Details</button>
                </center>
            </form>
        </div>
    </div>
</body>

</html>
