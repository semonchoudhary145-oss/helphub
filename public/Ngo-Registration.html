<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
         <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <link rel="stylesheet" href="style/Avail-med.css">
         <script>
            function back(){
                localStorage.removeItem("activeuser");
                location.href="Dash-NGO.html"
            }
         </script>
         <script>
        function setemail(){
            document.getElementById("txtEmail").value=localStorage.getItem("activeuser");
            document.getElementById("txtEmail").readonly=true;
        }
    </script>
        <script>
             function doshowprev6(fileCtrl, prev) {
            const file = fileCtrl.files[0];
            if (file) {
                prev.src = URL.createObjectURL(file);
            }
        }
        </script>
</head>

<body onload="setemail()">

    <!------------------------NAVBAR-------------------------->
    
    <nav class="navbar navbar-expand-lg" style="background-color: rgb(57, 102, 144);">
        <div class="container-fluid">
            <a class="navbar-brand text-white d-flex align-items-center fw-bold fs-5 w-100" href="#">
                <img src="/pics/websitelogo.jpeg" alt="Logo" class="rounded-circle me-2" width="35" height="35"
                    class="d-inline-block align-text-top me-2 rounded">
              <span
                    style="text-shadow: 2px 2px 4px rgba(255,255,255,0.7); box-shadow: 0 8px 12px rgba(0,0,0,0.3); ">Help_Hub.com</span>
                     <!--<span class="text-white fw-bold fs-5 position-absolute top-50 start-50 translate-middle"
                    style="text-shadow: 2px 2px 4px rgba(255,255,255,0.7); ">HELLO DONORS 🙋🏻‍♀️</span>-->
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <form class="d-flex gap-3 ms-auto">


                <button class="btn btn-outline-light" onclick="back()" type="button">Back</button>
            </form>

        </div>

    </nav>

   <div class="container mt-4">
        <div class="ProfileForm"> 
            <h2 class="text-center mb-4" style="color: rgb(25, 57, 87);">NGO PROFILE</h2>
            <br><br>

            <form action="/chk-ngoregister" method="post" enctype="multipart/form-data">
                <div class="row g-4 ">
                    <!------------------------left side wali pic upload------------------------>
                    
                     <div class="col-md-5">
                       
                        <div class="card p-3 text-center upload-card">
                             <label><b>📷 Register Proof:</b></label>
                            <input type="file" name="ngopic" id="ngopic" class="form-control custom-file"
                                onchange="doshowprev6(this,prev6)">
                            <center>
                                <img src="" id="prev6" alt="" width="200" height="200" class="preview-img">
                            </center>
                        </div>
                    </div>


                    <!-----------------------right side wala form-------------------------------->
                    <div class="col-md-7 row g-1">
                        <div class="col-12 mb-3">
                            <label><b>Email ID:</b></label>
                            <input type="email" name="txtEmail" id="txtEmail" class="form-control"
                                placeholder="Enter your emailid" required>
                        </div>
                        <div class="col-md-4 mb-4">
                            <label><b>NGO Name:</b></label>
                            <input type="text" name="txtNgoname" id="txtNgoname" class="form-control"
                                placeholder="Enter NGO Name" required>
                        </div>
                        <div class="col-md-4 mb-6">
                            <label><b>Register Office:</b></label>
                            <input type="text" name="txtRegoff" id="txtRegoff" class="form-control"
                                placeholder="Enter Registered Office" required>
                        </div>
                        <div class=" col-md-4 mb-3 mb-1">
                            <label><b>City:</b></label>
                            <input type="text" name="txtCity" id="txtCity" class="form-control" placeholder="Enter City"
                                required>
                        </div>
                        <div class="row">
                            <div class=" col-md-4 mb-3 mb-1">
                                <label><b>Website:</b></label>
                                <input type="text" name="txtWebsite" id="txtWebsite" class="form-control"
                                    placeholder="Enter Website" required>
                            </div>
                            <div class=" col-md-4 mb-3 mb-1">
                                <label><b>Contact Number:</b></label>
                                <input type="text" name="txtContact" id="txtContact" class="form-control"
                                    placeholder="Enter Contact No." required>
                            </div>
                            <div class=" col-md-4 mb-3 mb-1">
                                <label><b>Since:</b></label>
                                <input type="text" name="txtSince" id="txtSince" class="form-control" required>
                            </div>
                        </div>
                        <div class=" col-md-6 mb-3 mb-1">
                            <label><b>Chair Person:</b></label>
                            <input type="text" name="txtChairper" id="txtChairper" class="form-control"
                                placeholder="Enter Chair Person" required>
                        </div>
                        <div class=" col-md-6 mb-3 mb-1">
                            <label><b>NGO-Profile/Works:</b></label>
                            <input type="text" name="txtNgoprof" id="txtNgoprof" class="form-control"
                                placeholder="Enter NGO Profile" required>
                        </div>
                        <div class=" col-md-10 mb-3 mb-1">
                            <label><b>Registration Number:</b></label>
                            <input type="text" name="txtRegnum" id="txtRegnum" class="form-control"
                                placeholder="Enter Registratin Number" required>
                        </div>
                       <div class="col-12 text-center ">
                            <button type="submit" class="btn text-white w-100" style="background-color: rgb(57, 102, 144);">Register Now</button>
                        </div>

                </div>
            </form>
        </div>
    </div>
</body>

</html>
