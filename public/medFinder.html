<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="style/ngo-finder.css">
    
   <script>
            function back(){
                localStorage.removeItem("activeuser");
                location.href="Dash-NGO.html"
            }
         </script>
</head>

<script>
    let myModule = angular.module("modulekuch", []);
    let myController = myModule.controller("controllerkuch", function ($scope, $http) {
        //--------------------------------------------//
        $scope.dofetchallmedicines = function () {
            //alert("function chala");
            let url = "/fetch-distinct-medicines";
            $http.get(url).then(function (resp) {
                // console.log(resp.data);
                $scope.jsonarraymed = resp.data;
            }, function (err) {
                alert("Error:" + err);
            })
        }
        //-------------------------------------------//
        $scope.dofetchallcity = function () {
            // alert("function chala");
            let url = "/fetch-distinct-city";
            $http.get(url).then(function (resp) {
                // console.log(resp.data);
                $scope.jsonarraycity = resp.data;
            }, function (err) {
                alert("Error:" + err);
            })
        }
        //---------find donor city or medicines-------//
        $scope.finddonor = function () {
            // alert("button clicked");
            let url = "/find-donorcitymed?city=" + $scope.selcity + "&medicine=" + $scope.selmedicine;

            $http.get(url).then(function (resp) {
                // alert("data aa gaya");
                // console.log(resp.data);
                alert(JSON.stringify(resp.data));
                $scope.jsonarraydonors = resp.data;
            }, function (err) {
                alert("Error:" + err);
            })
        }
        //----------------------------------------------//
        $scope.showdetailsdonors = function (email) {

            let url = "/fetch-donors?email=" + email;

            $http.get(url).then(function (resp) {
                $scope.jsonarray22 = resp.data;
            }, function (err) {
                alert(err.data);
            });

        }




    })
</script>

<body ng-app="modulekuch" ng-controller="controllerkuch" ng-init="dofetchallmedicines();dofetchallcity();">
    <!--------------------nav bar----------------------->
    <nav class="navbar navbar-expand-lg" style="background-color: rgb(57, 102, 144);">
        <div class="container-fluid">
            <a class="navbar-brand text-white d-flex align-items-center fw-bold fs-5 w-100" href="#">
                <img src="/pics/websitelogo.jpeg" alt="Logo" class="rounded-circle me-2" width="35" height="35"
                    class="d-inline-block align-text-top me-2 rounded">
              <span
                    style="text-shadow: 2px 2px 4px rgba(255,255,255,0.7); box-shadow: 0 8px 12px rgba(0,0,0,0.3); ">Help_Hub.com</span>
                     <!--<span class="text-white fw-bold fs-5 position-absolute top-50 start-50 translate-middle"
                    style="text-shadow: 2px 2px 4px rgba(255,255,255,0.7); ">HELLO DONORS 🙋🏻‍♀️</span>-->
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <form class="d-flex gap-3 ms-auto">


                <button class="btn btn-outline-light" onclick="back()" type="button">Back</button>
            </form>

        </div>

    </nav>
    <div class="container mt-4">

        <div class="ProfileForm2">
            <h2 class="text-center mb-4" style="color: rgb(30, 64, 96);">MEDICINE FINDER</h2>
            <div class="row gx-3 mb-3 align-items-end">
                <div class="col-md-4">
                    <label for="inputName4" class="form-label mb-1"><b>City:</b></label>
                    <input type="text" list="city-list" ng-model="selcity" class="form-control "
                        placeholder="Enter City" required>
                    <datalist id="city-list">
                        <option ng-repeat="obj in jsonarraycity" value="{{obj.city}}"></option>

                    </datalist>

                </div>
                <div class="col-md-4">
                    <label for="inputName4" class="form-label mb-1"><b>Medicines:</b></label>
                    <input type="text" list="Medicine-list" ng-model="selmedicine" class="form-control "
                        placeholder="Enter Medicine" required>
                    <datalist id="Medicine-list">
                        <option ng-repeat="obj in jsonarraymed" value="{{obj.medname}}"></option>

                    </datalist>
                </div>
                <div class="col-md-4">
                    <button type="button" class="btn text-white w-80" style="background-color: rgb(57, 102, 144);" id="btnajax" name="btnajax"
                        ng-click="finddonor()">Find Medicines</button>
                </div>
            </div>

            <br>

            <!--card medinfo-->
            <div class="container">
                <div class="row g-3">
                    <div class="col-md-3" ng-repeat="obj in jsonarraydonors">
                        <div class="card" style="width:16rem; border: 2px black solid;">
                            <center>
                                <img src="{{obj.picurl}}" style="width: 100%; height: 180px; object-fit: contain;"
                                    class="card-img-top medimg" alt="...">

                                <div class="card-body">
                                    <h5 class="card-title email">{{obj.email}}</h5>
                                    <p class="card-text">
                                        {{obj.medname}}
                                    </p>
                                    <p class="card-text">
                                        {{obj.qty}}
                                    </p>
                                    <p class="card-text">
                                        {{obj.company}}
                                    </p>
                                    <p class="card-text">
                                        {{obj.expdate}}
                                    </p>


                                    <button class="btn text-white" style="background-color: rgb(57, 102, 144);" type="button" data-bs-toggle="modal"
                                        data-bs-target="#contactdonorModal"
                                        ng-click="showdetailsdonors(obj.email)">Contact
                                        Donor</button>
                                </div>
                            </center>
                        </div>
                    </div>
                </div>
            </div>
            <!------------modal contact donor-->
            <div class="modal fade" id="contactdonorModal" tabindex="-1" aria-labelledby="exampleModalLabel"
                aria-hidden="true">
                <div class="modal-dialog modal-xl">
                    <div class="modal-content">
                        <div class="modal-header text-white" style="background-color: rgb(57, 102, 144);">
                            <h1 class="modal-title fs-5" id="exampleModalLabel">Donor Profile</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>

                        <table class="table table-bordered">
                            <thead>
                                <tr>
                                    <th scope="col">Sr.No</th>
                                    <th scope="col">Emailid</th>
                                    <th scope="col">Name</th>
                                    <th scope="col">Mobile</th>
                                    <th scope="col">Address</th>
                                    <th scope="col">City</th>
                                    <th scope="col">Aadhar Card</th>
                                    <th scope="col">Profile pic</th>

                                </tr>
                            </thead>
                            <tbody class="table-group-divider">
                                <tr ng-repeat="obj in jsonarray22">
                                    <td>{{$index+1}}</td>
                                    <td>{{obj.emailid}}</td>
                                    <td>{{obj.name}}</td>
                                    <td>{{obj.mobile}}</td>
                                    <td>{{obj.address}}</td>
                                    <td>{{obj.city}}</td>
                                    <td>
                                        <center>
                                            <img src={{obj.acardpath}} width="50" height="50" alt="">
                                        </center>
                                    </td>
                                    <td>
                                        <center>
                                            <img src={{obj.picpath}} width="50" height="50" alt="">
                                        </center>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
